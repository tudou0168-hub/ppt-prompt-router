    <text x="64" y="679" fill="#86A3B5" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14">规划口径：模块与指标均为拟建方向或建设预期，不作为五寨县既有成果引用。</text>
    <text x="1216" y="679" text-anchor="end" fill="#37C6F4" font-family="Menlo, Consolas, monospace" font-size="14">五寨县“人工智能+”政务服务规划方案</text>
