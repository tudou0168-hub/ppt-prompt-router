    <g id="dependency-tags" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700">
      <rect x="649" y="510" width="103" height="34" rx="17" fill="#174563" stroke="#37C6F4" stroke-width="1"/><text x="700.5" y="533" text-anchor="middle" fill="#BDEBFA">事项标准</text>
      <rect x="765" y="510" width="103" height="34" rx="17" fill="#174E48" stroke="#73E2B4" stroke-width="1"/><text x="816.5" y="533" text-anchor="middle" fill="#C5F5DD">材料规则</text>
      <rect x="881" y="510" width="103" height="34" rx="17" fill="#5A4726" stroke="#FFC65A" stroke-width="1"/><text x="932.5" y="533" text-anchor="middle" fill="#FFE2A8">身份核验</text>
      <rect x="997" y="510" width="174" height="34" rx="17" fill="#3A3C67" stroke="#A6A7FF" stroke-width="1"/><text x="1084" y="533" text-anchor="middle" fill="#D9D9FF">业务系统对接</text>
    </g>
    <text x="92" y="591" fill="#9CB5C6" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17">本地高频事项、材料字段、业务权限、可用接口及合法合规条件，决定首批闭环能否上线。</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 650 1152 40">
