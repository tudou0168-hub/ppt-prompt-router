  <g id="header" data-pptx-bounds="64 46 1152 134">
    <rect x="64" y="46" width="74" height="26" rx="13" fill="#153B5C" stroke="#37C6F4" stroke-width="1"/>
    <text x="101" y="64" text-anchor="middle" fill="#8EDFF7" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1">P08</text>
    <text x="154" y="65" fill="#73E2B4" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">智能办事 / 事项闭环</text>
    <text x="64" y="113" fill="#F2F8FC" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" font-weight="700">围绕高频事项，降低填报、预审与跨层级办理摩擦</text>
    <text x="64" y="151" fill="#B7CAD8" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22">先以事项流程重塑为前提，再让智能能力服务于“少填、少等、少跑、少重复”。</text>
    <line x1="64" y1="180" x2="1216" y2="180" stroke="#2A6284" stroke-width="1"/>
  </g>
  <g id="scenario-capabilities" data-pptx-bounds="64 210 1152 224">
    <g id="card-fill-precheck">
      <rect x="64" y="210" width="268" height="224" rx="10" fill="url(#p08-panel)" stroke="#2C6D91" stroke-width="1.2"/>
      <rect x="64" y="210" width="7" height="224" rx="3.5" fill="#37C6F4"/>
      <text x="91" y="248" fill="#8EDFF7" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1">01 / 填单与预审</text>
      <text x="91" y="291" fill="#F2F8FC" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="25" font-weight="700">减少“填得慢、填错”</text>
      <line x1="91" y1="310" x2="305" y2="310" stroke="#2A6284" stroke-width="1"/>
      <text x="91" y="340" fill="#C8D8E4" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">自然语言引导 · 材料识别</text>
      <text x="91" y="370" fill="#C8D8E4" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">表单预填 · 合规校验</text>
      <text x="91" y="407" fill="#77BBD5" font-family="Menlo, Consolas, monospace" font-size="13">高频事项优先验证</text>
    </g>
    <g id="card-enterprise-consult">
