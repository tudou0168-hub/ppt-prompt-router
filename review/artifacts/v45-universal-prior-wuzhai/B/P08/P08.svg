      <text x="379" y="291" fill="#F2F8FC" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="25" font-weight="700">减少“找不准、问不清”</text>
      <line x1="379" y1="310" x2="593" y2="310" stroke="#2A6B6A" stroke-width="1"/>
      <text x="379" y="340" fill="#C8D8E4" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">企业画像—政策条件匹配</text>
      <text x="379" y="370" fill="#C8D8E4" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">对话式办事指引</text>
      <text x="379" y="407" fill="#86D9B4" font-family="Menlo, Consolas, monospace" font-size="13">规则清晰后再接入</text>
    </g>
    <g id="card-grassroots">
      <rect x="640" y="210" width="268" height="224" rx="10" fill="url(#p08-panel)" stroke="#8F6A32" stroke-width="1.2"/>
      <rect x="640" y="210" width="7" height="224" rx="3.5" fill="#FFC65A"/>
      <text x="667" y="248" fill="#FFD98D" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1">03 / 基层延伸</text>
      <text x="667" y="291" fill="#F2F8FC" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="25" font-weight="700">减少“跑得远、办不了”</text>
