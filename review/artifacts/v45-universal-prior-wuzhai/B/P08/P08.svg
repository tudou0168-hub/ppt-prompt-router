      <text x="667" y="340" fill="#C8D8E4" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">远程视频 · 身份核验</text>
      <text x="667" y="370" fill="#C8D8E4" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">材料上传 · 电子签名 · 云端办理</text>
      <text x="667" y="407" fill="#F1C76A" font-family="Menlo, Consolas, monospace" font-size="13">承接能力须先核实</text>
    </g>
    <g id="card-traceability">
      <rect x="928" y="210" width="288" height="224" rx="10" fill="url(#p08-panel)" stroke="#6267A6" stroke-width="1.2"/>
      <rect x="928" y="210" width="7" height="224" rx="3.5" fill="#A6A7FF"/>
      <text x="955" y="248" fill="#C4C5FF" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1">04 / 服务留痕</text>
      <text x="955" y="291" fill="#F2F8FC" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="23" font-weight="700">减少“难追溯、难改进”</text>
      <line x1="955" y1="310" x2="1189" y2="310" stroke="#5A5E90" stroke-width="1"/>
      <text x="955" y="340" fill="#C8D8E4" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">窗口录音质检</text>
      <text x="955" y="370" fill="#C8D8E4" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">云勘验过程可追溯</text>
      <text x="955" y="407" fill="#B9BAFA" font-family="Menlo, Consolas, monospace" font-size="13">合规边界同步明确</text>
