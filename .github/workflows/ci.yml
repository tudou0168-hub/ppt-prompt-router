name: 持续集成

on:
  push:
  pull_request:

jobs:
  验证:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python 语法检查
        run: python -m compileall -q install.py installers scripts tests
      - name: Router 与安全测试
        run: python -m unittest discover -s tests -v
